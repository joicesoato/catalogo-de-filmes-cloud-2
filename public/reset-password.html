<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Redefinir senha | Catálogo de Filmes</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <main class="reset-page">

    <section class="reset-card" aria-labelledby="reset-title">

      <a class="reset-brand" href="/">
        🎬 Catálogo de Filmes
      </a>

      <p class="reset-eyebrow">
        Acesso à sua conta
      </p>

      <h1 id="reset-title">
        Crie uma nova senha
      </h1>

      <p class="reset-intro">
        Escolha uma senha nova para voltar ao seu catálogo com segurança.
      </p>

      <form id="reset-form">

        <div class="form-group">
          <label for="new-password">
            Nova senha
          </label>

          <input
            type="password"
            id="new-password"
            name="new-password"
            autocomplete="new-password"
            minlength="6"
            maxlength="128"
            aria-describedby="password-help"
            required
          >

          <p id="password-help" class="password-help">
            Use pelo menos 6 caracteres.
          </p>
        </div>

        <button
          id="reset-submit"
          class="reset-submit"
          type="submit"
        >
          Redefinir senha
        </button>

      </form>

      <p
        id="reset-feedback"
        class="feedback"
        role="status"
        aria-live="polite"
      ></p>

      <a class="back-link" href="/">
        Voltar para o login
      </a>

    </section>

  </main>

  <script src="/reset-password.js" defer></script>

</body>
</html>

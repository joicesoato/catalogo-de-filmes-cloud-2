name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: joicesoato/catalogo-filmes-tom-hanks
  AUTH_IMAGE: joicesoato/catalogo-filmes-tom-hanks-auth
  LOG_IMAGE: joicesoato/catalogo-filmes-tom-hanks-log

jobs:
  test:
    name: Build e teste real
    runs-on: ubuntu-latest
    env:
      DB_NAME: catalogo_ci
      DB_USER: catalogo_ci
      DB_PASSWORD: catalogo_ci_password
      TMDB_API_KEY: ci_dummy
      MAIL_HOST: localhost
      MAIL_PORT: 587
      MAIL_USER: ci@example.com
      MAIL_PASSWORD: ci_dummy
      MAIL_FROM: ci@example.com
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-jwt-secret-change-me
      SESSION_SECRET: ci-session-secret-change-me
      INTERNAL_SERVICE_SECRET: ci-internal-secret-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Build dos containers
        run: docker compose build

      - name: Subir stack para teste
        run: docker compose up -d

      - name: Aguardar aplicação saudável
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color app auth-service log-service db
          exit 1

      - name: Testar métricas
        run: curl -fsS http://localhost:3000/metrics | grep -q 'http_requests_total'

      - name: Testar health do log-service
        run: docker compose exec -T log-service node -e "fetch('http://127.0.0.1:3002/health').then(async r=>{console.log(await r.text()); process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Testar serviço de autenticação
        run: docker compose exec -T auth-service node -e "fetch('http://127.0.0.1:3001/health').then(async r=>{console.log(await r.text()); process.exit(r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Encerrar stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagens Docker
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.AUTH_IMAGE }}:${{ github.sha }}
            ${{ env.AUTH_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar log-service
        uses: docker/build-push-action@v6
        with:
          context: ./log-service
          push: true
          tags: |
            ${{ env.LOG_IMAGE }}:${{ github.sha }}
            ${{ env.LOG_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy do Portainer
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.PORTAINER_WEBHOOK != '' }}
        run: curl --fail --silent --show-error -X POST "$PORTAINER_WEBHOOK"
